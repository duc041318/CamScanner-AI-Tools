<div class="card" data-card-id="card-05">
  <style>
    .card[data-card-id="card-05"] .root {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      box-sizing: border-box; padding: 0 56px 160px 56px;
      color: var(--text); font-family: 'Inter', sans-serif;
    }
    .card[data-card-id="card-05"] .scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 68%;
      background: linear-gradient(to top, rgba(8,8,10,1) 0%, rgba(8,8,10,1) 40%, rgba(8,8,10,0.65) 60%, rgba(8,8,10,0) 100%);
      pointer-events: none;
    }
    .card[data-card-id="card-05"] .content { position: relative; z-index: 1; }
    .card[data-card-id="card-05"] .meta { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .card[data-card-id="card-05"] .dot {
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent-4);
      box-shadow: 0 0 20px var(--accent-4), 0 0 6px var(--accent-4);
    }
    .card[data-card-id="card-05"] .kicker {
      font: 700 20px/1 'Inter', sans-serif; letter-spacing: 0.22em; color: var(--accent-4); text-transform: uppercase;
    }
    .card[data-card-id="card-05"] .title {
      margin: 0 0 14px 0; font: 800 84px/1.16 'Inter', sans-serif; color: var(--text);
      text-shadow: 0 4px 40px rgba(0,0,0,0.6);
    }
    .card[data-card-id="card-05"] .title .word { display: inline-block; white-space: nowrap; }
    .card[data-card-id="card-05"] .detail {
      margin: 0; font: 500 34px/1.4 'Inter', sans-serif; color: #cfcfd6;
    }
    .card[data-card-id="card-05"] .bar {
      margin-top: 22px; height: 8px; width: 0; border-radius: 4px; background: var(--accent-4);
      box-shadow: 0 0 16px var(--accent-4);
    }
  </style>

  <div class="root">
    <div class="scrim"></div>
    <div class="content">
      <div class="meta">
        <span class="dot" data-anim="scale-pop" data-anim-at="0.05" data-anim-duration="0.4"></span>
        <span class="kicker" data-anim="fade-in" data-anim-at="0.1" data-anim-duration="0.4">NGHI NGỜ</span>
      </div>
      <h1 id="card-05-title" class="title"
        data-anim="kinetic-chars" data-anim-at="0.3" data-anim-duration="0.6" data-anim-stagger="0.025" data-anim-pattern="pop">
        <span class="word"><span class="char">“</span><span class="char">C</span><span class="char">ư</span><span class="char">ờ</span><span class="char">i</span></span> <span class="char">&nbsp;</span><span class="word"><span class="char">đ</span><span class="char">ấ</span><span class="char">y</span></span> <span class="char">&nbsp;</span><span class="word"><span class="char">k</span><span class="char">h</span><span class="char">ô</span><span class="char">n</span><span class="char">g</span><span class="char">?</span><span class="char">”</span></span>
      </h1>
      <p class="detail" data-anim="fade-in" data-anim-at="1.1" data-anim-duration="0.5">“nào nó lừa…”</p>
      <div id="card-05-bar" class="bar" data-anim="grow-x" data-anim-at="0.9" data-anim-duration="0.5" data-anim-target-w="120"></div>
    </div>
  </div>
</div>
